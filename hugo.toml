baseURL = "https://go-ruby-rational.github.io/"
title = "go-ruby-rational"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Exact arithmetic"
  status = "ready"
  blurb = "`Add` / `Sub` / `Mul` / `Div` over arbitrary-precision integers (a `math/big.Rat` core), always reduced to lowest terms with a positive denominator; `Div` by zero raises `ErrZeroDivision` (MRI `ZeroDivisionError`), as do `Reciprocal` of zero and `0r ** -1`."
[[params.phases]]
  name = "Pow — exact, with Float fallback"
  status = "ready"
  blurb = "`Pow` keeps an **integer** exponent exact (`(3/4) ** -1 == (4/3)`); `PowFloat` provides MRI's Float fallback (`a.to_f ** exp`) for a Rational/Float exponent."
[[params.phases]]
  name = "Normalisation"
  status = "ready"
  blurb = "`Rational(2, 4) → (1/2)`, negative-denominator folding (`Rational(1, -2) → (-1/2)`), `Rational(0, n) → (0/1)` — Ruby's normalisation with the sign on the numerator."
[[params.phases]]
  name = "ToS vs Inspect & conversions"
  status = "ready"
  blurb = "MRI's split — `to_s → \"3/4\"`, `inspect → \"(3/4)\"` (`String()` returns the inspect form). `ToI` (truncate toward zero), `ToF` (nearest-even), `ToR`, and `Truncate`/`Floor`/`Ceil`/`Round` to an Integer."
[[params.phases]]
  name = "Digit-aware rounding"
  status = "ready"
  blurb = "`FloorN` / `CeilN` / `RoundN` / `TruncateN` return a **Rational** for `n >= 1` and an **Integer** for `n <= 0`, with MRI's half-away-from-zero rounding (`(5/2).round == 3`, `(-5/2).round == -3`)."
[[params.phases]]
  name = "Comparison, Parse & differential oracle"
  status = "ready"
  blurb = "`Cmp`/`Eql`/`EqlStrict` against Rational, Integer and Float (`NaN` undefined like MRI's `nil`); `Parse` for `Rational(String)`. A wide corpus is inspected here and by the system `ruby`, compared byte-for-byte; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

